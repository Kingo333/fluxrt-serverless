name: build-runpod-worker

on:
  push:
    branches:
      - main
      - runpod/doc-native-clean-worker
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR builds only check that the image builds. Publishing happens on push to
      # main (or the listed branches), so a PR can never replace the tag RunPod pulls.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/kingo333/fluxrt-serverless:doc-native-health
            ghcr.io/kingo333/fluxrt-serverless:doc-native-health-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
