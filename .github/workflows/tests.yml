name: tests

on:
  push:
    branches: [main, feat/livecam-joyai-engine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q tests
      - run: bash -n joyai/start_upstream.sh && bash -n joyai/scripts/populate_volume.sh
