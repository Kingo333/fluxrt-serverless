name: build-livecam-fluxrt

# FluxRT-only Live Cam image (Dockerfile.livecam-fluxrt): the dual image's FluxRT engine without JoyAI.
# About 4.5 GB smaller and about a third of the build time. Publishes ONLY livecam-fluxrt-* tags; the dual
# image (FluxRT + JoyAI, livecam-dual-* tags) is still built by build-livecam-dual.yml.
on:
  push:
    branches:
      - main
      # The FP8 / compile test branch: workflow_dispatch only works for workflows already on main.
      - feat/fluxrt-fp8
    paths:
      - Dockerfile.livecam-fluxrt
      - Dockerfile.livecam
      - server.py
      - bootstrap.py
      - session_token.py
      - livecam/**
      - fluxrt/patches/**
      - fluxrt/constraints.txt
      - .github/workflows/build-livecam-fluxrt.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-livecam-fluxrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Pinned like build-livecam-dual.yml (ubuntu-latest moves to Ubuntu 26 from 2026-10-19).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Same as build-livecam-dual.yml: the BuildKit container uses the runner's own network and DNS.
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The moving tag livecam-fluxrt-v1 only follows main; any other branch gets its own commit tag only.
      - name: Choose image tags
        id: tags
        run: |
          SHA_TAG="ghcr.io/kingo333/fluxrt-serverless:livecam-fluxrt-v1-${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            { echo "tags<<EOF"; echo "ghcr.io/kingo333/fluxrt-serverless:livecam-fluxrt-v1"; echo "$SHA_TAG"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            { echo "tags<<EOF"; echo "$SHA_TAG"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi
          echo "Image tag for this build: $SHA_TAG"

      - name: Build and push FluxRT-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.livecam-fluxrt
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # No Actions cache, as for the dual image (layers exceed the per-repo cache limit).
          no-cache: true
