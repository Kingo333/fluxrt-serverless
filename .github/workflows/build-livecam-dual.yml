name: build-livecam-dual

# Dual-engine image (FluxRT + JoyAI, picked by LIVECAM_ENGINE).
# Publishes ONLY the livecam-dual-* tags, never the live FluxRT tags.
on:
  push:
    branches:
      - main
      - feat/livecam-joyai-engine
    paths:
      - Dockerfile.livecam
      - server.py
      - bootstrap.py
      - session_token.py
      - joyai/**
      - .github/workflows/build-livecam-dual.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-livecam-dual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; the passing build ran on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dual-engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.livecam
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kingo333/fluxrt-serverless:livecam-dual-v1
            ghcr.io/kingo333/fluxrt-serverless:livecam-dual-v1-${{ github.sha }}
          # No Actions cache: the image layers exceed GitHub's 10 GB per-repo
          # cache limit, so a restored cache is partial and the build fails.
          no-cache: true
          # Fewer parallel CUDA compiles so the 16 GB runner isn't starved
          # ("hosted runner lost communication" during the kernel builds).
          build-args: |
            MAX_JOBS=2
            EXT_PARALLEL=1
            NVCC_THREADS=1
