name: build-fluxrt-stream-fix

on:
  push:
    branches:
      - fix/livecam-stream-freeze
    paths:
      - Dockerfile.fluxrt
      - server.py
      - bootstrap.py
      - .github/workflows/build-fluxrt-stream-fix.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "::group::Disk before cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "::group::Disk after cleanup"
          df -h /
          echo "::endgroup::"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FluxRT stream-fix image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fluxrt
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kingo333/fluxrt-serverless:fluxrt-stream-fix-v1
            ghcr.io/kingo333/fluxrt-serverless:fluxrt-stream-fix-v1-${{ github.sha }}
          cache-from: type=gha,scope=fluxrt-stream-fix
          cache-to: type=gha,mode=max,scope=fluxrt-stream-fix
